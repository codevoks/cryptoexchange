name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mypassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:mypassword@localhost:5432/mydatabase
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-deployment
      SALT_ROUNDS: "10"
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      REDIS_CHANNEL_ORDERBOOK_PREFIX: orderbook
      REDIS_CHANNEL_TRADE_PREFIX: tradebook
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Test
        run: npx turbo run test

      - name: Build
        # Bypasses the root `build` script's `dotenv -e .env --` wrapper —
        # there's no .env file in CI, everything needed is already in `env:` above.
        run: npx turbo run build

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Web
        run: |
          docker build -f docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_WS_URL=ws://${{ vars.EC2_HOST }}:8080 \
            -t ${{ secrets.DOCKER_USERNAME }}/crypto-web:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/crypto-web:latest
      - name: Build & Push Engine
        run: |
          docker build -f docker/Dockerfile.engine -t ${{ secrets.DOCKER_USERNAME }}/crypto-engine:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/crypto-engine:latest
      - name: Build & Push WS-Server
        run: |
          docker build -f docker/Dockerfile.ws-server -t ${{ secrets.DOCKER_USERNAME }}/crypto-ws:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/crypto-ws:latest

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/application

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/application"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ------------------------
            # 1. Install Docker if missing
            if ! command -v docker &> /dev/null
            then
              echo "Docker not found. Installing..."
              sudo apt update
              sudo apt install -y ca-certificates curl gnupg lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt update
              sudo apt install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            else
              echo "Docker already installed."
            fi
            sudo usermod -aG docker $USER
            newgrp docker <<EONG
              docker version
            EONG

            echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            # 2. Ensure Docker Compose is available
            if ! docker compose version &> /dev/null
            then
              echo "Docker Compose not found. Installing..."
              sudo apt update
              sudo apt install -y docker-compose
            else
              echo "Docker Compose already installed."
            fi

            # ------------------------
            # 3. Prepare directory & environment
            mkdir -p ~/application
            cd ~/application
            rm -f .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}" >> .env
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "SALT_ROUNDS=${{ secrets.SALT_ROUNDS }}" >> .env
            echo "REDIS_CHANNEL_ORDERBOOK_PREFIX=${{ vars.REDIS_CHANNEL_ORDERBOOK_PREFIX }}" >> .env
            echo "REDIS_CHANNEL_TRADE_PREFIX=${{ vars.REDIS_CHANNEL_TRADE_PREFIX }}" >> .env
            echo "WS_PORT=8080" >> .env
            echo "NEXT_PUBLIC_WS_URL=ws://${{ vars.EC2_HOST }}:8080" >> .env

            # 4. Pull & recreate containers WITHOUT touching named volumes
            # (`down -v` here would wipe the production Postgres data
            # directory on every deploy — `down` alone stops/removes
            # containers but preserves volumes). The web container's own
            # startup command runs `prisma migrate deploy` before serving
            # traffic, so pending migrations still get applied.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
